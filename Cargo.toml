[package]
name = "pervetin"
version = "1.0.0"
edition = "2021"
description = "Keep the Mac awake on two stimulants, with an avatar that shows it"
authors = ["Marco Bettiolo"]
license = "MIT"
repository = "https://github.com/bettiolo/pervetin"
homepage = "https://github.com/bettiolo/pervetin"
readme = "README.md"
keywords = ["macos", "sleep", "caffeinate", "tui"]
categories = ["command-line-utilities"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
